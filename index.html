<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追風少年科技培力加分系統</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    padding: 20px;
    color: white;
  }
  h1 {
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,200,0,0.8);
    color: #FFD700;
    letter-spacing: 4px;
  }
  .subtitle {
    text-align: center;
    opacity: 0.6;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }

  /* Top Controls */
  .top-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn-reset {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    transition: all 0.2s;
  }
  .btn-reset:hover { background: #c0392b; transform: scale(1.05); }
  .sort-toggle {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    padding: 10px 24px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    transition: all 0.2s;
  }
  .sort-toggle:hover { background: rgba(255,255,255,0.25); }
  .sort-toggle.active { background: #27ae60; border-color: #2ecc71; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Card */
  .card {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(255,215,0,0.5); }
  .card.rank-1 { background: rgba(255,215,0,0.15); border-color: #FFD700; }
  .card.rank-2 { background: rgba(192,192,192,0.12); border-color: #C0C0C0; }
  .card.rank-3 { background: rgba(205,127,50,0.12); border-color: #CD7F32; }

  .rank-badge {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 1.3rem;
    font-weight: bold;
  }

  .team-name {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 8px;
    margin-top: 4px;
  }
  .score {
    font-size: 3rem;
    font-weight: bold;
    line-height: 1.1;
    margin: 8px 0;
    transition: transform 0.2s;
  }
  .score.bump { transform: scale(1.3); }
  .score-label { font-size: 0.75rem; opacity: 0.5; margin-bottom: 12px; }

  /* Score buttons */
  .btn-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .btn-score {
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: bold;
    flex: 1;
    transition: all 0.15s;
    min-width: 0;
  }
  .btn-score:active { transform: scale(0.92); }
  .btn-add { background: #27ae60; color: white; }
  .btn-add:hover { background: #2ecc71; }
  .btn-sub { background: #e74c3c; color: white; }
  .btn-sub:hover { background: #ff6b6b; }


  /* History */
  .history {
    font-size: 0.7rem;
    opacity: 0.45;
    margin-top: 6px;
    min-height: 16px;
  }

  /* Log panel */
  .log-panel {
    max-width: 1400px;
    margin: 24px auto 0;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .log-title {
    font-size: 0.9rem;
    font-weight: bold;
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .log-list {
    list-style: none;
    max-height: 120px;
    overflow-y: auto;
    font-size: 0.82rem;
    opacity: 0.7;
  }
  .log-list li { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .log-list li.plus { color: #2ecc71; }
  .log-list li.minus { color: #ff6b6b; }

  @media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .score { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<h1>🚀 追風少年科技培力</h1>
<p class="subtitle">點擊加分 / 扣分按鈕，即時更新各組分數</p>

<div class="top-bar">
  <button class="sort-toggle" id="sortBtn" onclick="toggleSort()">📊 依分數排序：關</button>
  <button class="btn-reset" onclick="confirmReset()">🔄 重置所有分數</button>
</div>

<div class="grid" id="grid"></div>

<div class="log-panel">
  <div class="log-title">📋 操作記錄</div>
  <ul class="log-list" id="logList"></ul>
</div>

<script>
const TEAM_COUNT = 10;
const TEAM_COLORS = [
  '#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c',
  '#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a'
];

function loadData() {
  const saved = localStorage.getItem('追風加分');
  if (saved) {
    const parsed = JSON.parse(saved);
    return parsed.teams || null;
  }
  return null;
}

function saveData() {
  localStorage.setItem('追風加分', JSON.stringify({ teams, logs }));
}

function loadLogs() {
  const saved = localStorage.getItem('追風加分');
  if (saved) {
    const parsed = JSON.parse(saved);
    return parsed.logs || [];
  }
  return [];
}

let teams = loadData() || Array.from({length: TEAM_COUNT}, (_, i) => ({
  id: i,
  name: `第 ${i+1} 組`,
  score: 0
}));

let sortActive = false;
let logs = loadLogs();

function getOrderedTeams() {
  if (!sortActive) return [...teams].sort((a, b) => a.id - b.id);
  return [...teams].sort((a, b) => b.score - a.score || a.id - b.id);
}

function getRankBadge(rank) {
  if (rank === 1) return '🥇';
  if (rank === 2) return '🥈';
  if (rank === 3) return '🥉';
  return `#${rank}`;
}

function getRankClass(rank) {
  if (rank === 1) return 'rank-1';
  if (rank === 2) return 'rank-2';
  if (rank === 3) return 'rank-3';
  return '';
}

function changeScore(teamId, delta) {
  const team = teams[teamId];
  const amount = delta;
  team.score += amount;
  if (team.score < 0) team.score = 0;

  // Log
  const sign = amount >= 0 ? '+' : '';
  const now = new Date();
  const time = now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  logs.unshift({ text: `${time}　${team.name}　${sign}${amount} 分　→ 共 ${team.score} 分`, plus: delta > 0 });
  if (logs.length > 50) logs.pop();

  saveData();
  renderGrid();
  renderLog();

  // bump animation
  setTimeout(() => {
    const scoreEl = document.querySelector(`[data-score="${teamId}"]`);
    if (scoreEl) { scoreEl.classList.add('bump'); setTimeout(() => scoreEl.classList.remove('bump'), 200); }
  }, 10);
}

function renderGrid() {
  const sorted = getOrderedTeams();
  const scoreRank = [...teams].sort((a,b) => b.score - a.score);
  const rankMap = {};
  scoreRank.forEach((t, i) => { rankMap[t.id] = i + 1; });

  const grid = document.getElementById('grid');
  grid.innerHTML = sorted.map(team => {
    const rank = rankMap[team.id];
    return `
    <div class="card ${getRankClass(rank)}" style="border-top: 4px solid ${TEAM_COLORS[team.id]}">
      <div class="rank-badge">${getRankBadge(rank)}</div>
      <div class="team-name" style="color:${TEAM_COLORS[team.id]}">${team.name}</div>
      <div class="score" data-score="${team.id}" style="color:${team.score===0?'rgba(255,255,255,0.3)':TEAM_COLORS[team.id]}">${team.score}</div>
      <div class="score-label">分</div>

      <div class="btn-row">
        <button class="btn-score btn-add" onclick="changeScore(${team.id}, 1)">＋加分</button>
        <button class="btn-score btn-sub" onclick="changeScore(${team.id}, -1)">－扣分</button>
      </div>
    </div>`;
  }).join('');
}

function renderLog() {
  const list = document.getElementById('logList');
  list.innerHTML = logs.map(l => `<li class="${l.plus?'plus':'minus'}">${l.text}</li>`).join('');
}

function toggleSort() {
  sortActive = !sortActive;
  const btn = document.getElementById('sortBtn');
  btn.textContent = sortActive ? '📊 依分數排序：開' : '📊 依分數排序：關';
  btn.classList.toggle('active', sortActive);
  renderGrid();
}

function confirmReset() {
  if (confirm('確定要重置所有組別的分數嗎？')) {
    teams.forEach(t => { t.score = 0; });
    logs.unshift({ text: `${new Date().toLocaleTimeString('zh-TW')}　⚠️ 所有分數已重置`, plus: false });
    saveData();
    renderGrid();
    renderLog();
  }
}

renderGrid();
</script>
</body>
</html>
